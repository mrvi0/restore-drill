[project]
name = "restore-drill"
version = "0.1.0"
description = "Restore your latest Postgres backup in a throwaway Docker container and check the data is really there."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "docker>=7.1",
    "boto3>=1.34",
]

[project.scripts]
restore-check = "restore_drill.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restore_drill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon (deselect with -m 'not docker')"]
